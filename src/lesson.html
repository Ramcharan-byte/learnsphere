<h2>What is a Data Structure?</h2>

<p>
A data structure is a way of organizing and storing

</p>

<h2>Why are Data Structures Important?</h2>

<ul>
<li>Efficient data storage</li>
<li>Faster searching</li>
<li>Efficient insertion and deletion</li>
<li>Better memory organization</li>
<li>Improved program performance</li>
</ul>

<h2>Types of Data Structures</h2>

<ul>
<li><strong>Linear:</strong> Arrays, Linked Lists, Stacks and Queues</li>
<li><strong>Non-linear:</strong> Trees and Graphs</li>
</ul>

<div class="lesson-note">
<strong>Key idea:</strong>
Choosing the right data structure can improve algorithm efficiency.
</div>

`
},

{

<p>
An array stores elements in contiguous memory locations.

</p>

<pre>
int marks[] = {80, 75, 90, 85};
</pre>

<h2>Linked Lists</h2>

<p>
A linked list contains nodes where each node stores data
and a reference to another node.
</p>

<pre>
[10] → [20] → [30] → NULL
</pre>

<h2>Difference</h2>

<ul>
<li>Arrays provide fast indexed access.</li>
<li>Linked lists make insertion and deletion easier.</li>

</ul>

Last In, First Out.
</p>

<h3>Operations</h3>

<ul>
<li>Push</li>
<li>Pop</li>
<li>Peek</li>
</ul>

<h2>Queue</h2>

<p>
A queue follows the <strong>FIFO</strong> principle:
First In, First Out.
</p>

<h3>Operations</h3>

<ul>
<li>Enqueue</li>
<li>Dequeue</li>
<li>Front</li>
</ul>

</pre>

<h2>Binary Search Tree</h2>

<p>
A Binary Search Tree follows this rule:

<ul>
<li>Smaller values go to the left.</li>

<h2>First Normal Form</h2>

<p>
Each field should contain atomic values.
</p>

<h2>Second Normal Form</h2>

<p>
The table should be in 1NF and non-key attributes should
depend on the complete primary key.
</p>

<h2>Third Normal Form</h2>

<p>
The table should be in 2NF and non-key attributes should
not depend on other non-key attributes.
</p>

    document.getElementById(
        "lessonTitle"
    ).textContent =
        "Lesson not found";

} else {

    renderLesson();

}



/* =====================================================
   RENDER
===================================================== */

function renderLesson() {

    document.getElementById(
        "lessonNumber"
    ).textContent =
        `LESSON ${lessonIndex + 1} OF ${courseLessons.length}`;


    document.getElementById(
        "lessonTitle"
    ).textContent =
        currentLesson.title;


    document.getElementById(
        "lessonIntro"
    ).textContent =
        currentLesson.intro;


    document.getElementById(
        "lessonContent"
    ).innerHTML =
        currentLesson.content;


    document.getElementById(
        "backLink"
    ).href =
        `course.html?id=${courseId}`;


    setupButtons();

}



/* =====================================================
   BUTTONS
===================================================== */

function setupButtons() {

    const previous =
        document.getElementById(
            "previousButton"
        );

    const next =
        document.getElementById(
            "nextButton"
        );

    const complete =
        document.getElementById(
            "completeButton"
        );


    if (lessonIndex === 0) {

        previous.disabled = true;

        previous.style.opacity =
            "0.4";

    } else {

        previous.onclick = () => {

            goToLesson(
                lessonIndex - 1
            );

        };

    }


    if (
        lessonIndex ===
        courseLessons.length - 1
    ) {

        next.textContent =
            "Finish Course ✓";

        next.onclick = () => {

            markComplete();

            window.location.href =
                `course.html?id=${courseId}`;

        };

    } else {

        next.onclick = () => {

            goToLesson(
                lessonIndex + 1
            );

        };

    }


    complete.onclick =
        markComplete;


    updateCompleteButton();

}



/* =====================================================
   COMPLETE LESSON
===================================================== */

function markComplete() {

    const key =
        `course_${courseId}_completed`;


    let completed = [];


    try {

        completed =
            JSON.parse(
                sessionStorage.getItem(
                    key
                )
            ) || [];

    } catch {

        completed = [];

    }


    if (
        !completed.includes(
            lessonIndex
        )
    ) {

        completed.push(
            lessonIndex
        );

    }


    sessionStorage.setItem(
        key,
        JSON.stringify(
            completed
        )
    );


    updateCompleteButton();

}



/* =====================================================
   UPDATE BUTTON
===================================================== */

function updateCompleteButton() {

    const key =
        `course_${courseId}_completed`;


    let completed = [];


    try {

        completed =
            JSON.parse(
                sessionStorage.getItem(
                    key
                )
            ) || [];

    } catch {

        completed = [];

    }


    const button =
        document.getElementById(
            "completeButton"
        );


    if (
        completed.includes(
            lessonIndex
        )
    ) {

        button.textContent =
            "✓ Lesson Completed";

        button.style.background =
            "#174c3b";

        button.style.color =
            "#45e6a5";

    }

}



/* =====================================================
   NAVIGATION
===================================================== */

function goToLesson(index) {

    window.location.href =
        `lesson.html?course=${encodeURIComponent(
            courseName
        )}&courseId=${courseId}&lesson=${index}`;

}



/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    sessionStorage.clear();

    window.location.href =
        "student-login.html";

}

</script>
